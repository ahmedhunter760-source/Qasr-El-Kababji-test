<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Qasr El Kababji</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {

            --red-color:#FF0000;
            --other-red:#E62117;
            --gold-color:#FEE135;
            --darck-gold:#E0B75C;
            --black-color:#0A0A0A;
            --gray-color:#555;
            --margin-spice:40px;
            --padding:30px;
            --bottom-color:#ff9900;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial,sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--darck-gold);
            scroll-behavior: smooth;
        }

        
        header {
            background-color: black;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            /* position: fixed; */
            align-items: center;
            width: 100%;
            height: 100px;
            margin: 0;
        }

        header .logo {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        header .logo img {
            width: 80px;
            height: 80px;
        }

        header .logo h1 {
            font-size: 28px;
            color: var(--darck-gold);
        }

        header ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: row;
            gap: 40px;
            text-align: center;
            align-items: center;
            position: relative;
        }

        header ul li {
            margin-right: 20px;
            text-align: center;
        }
        header ul li a {
            text-decoration: none;
            color: var(--darck-gold);
            font-size: 18px;
        }

        header ul li a:hover {
           color: var(--red-color);
        } 

        /* /* end navigation * */


        /* start menu  */
        .offers {
            background-color: var(--darck-gold);
            padding-bottom:var(--padding) ;
        }

        .offers h2 {
            margin:20px 0 20px 40px;
            
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
        }

        .offers img {
            padding: 0;
            margin:0;
            width: 100%;
        }
        .offer-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 30px;
        }
        .offer-box {
            background-color: var(--black-color);
            border-radius: 15px;
            padding: 10px;
            width: 280px;
            height: 300px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease 0.1s;
            transition: flex-grow .3s linear 0.1s;
            text-align: center;
            overflow: hidden;
        }
        .offer-box:hover {
            transform:scale(1.1);
        }
        .offer-box img {
            width: 100%;
            height: 290px;
            border-radius: 10px;
            margin-bottom: 15px;
            padding: 5px;
        }

        /* start scroll  */
        #scroll {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            padding: 5px;
            border: 2px dotted #777;
            color: var(--bottom-color);
            position: fixed;
            bottom: 10px;
            right: 10px;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../images/logo 001.jpg" alt="logo">
            <h1>Qasr El-Kababji</h1>
        </div>
        
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="Barbecue.html">Dishes</a></li>
            <li><a href="drink.html">Drink</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="story.html">story</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </header>
    
    <!-- start menu section  -->

    <div class="offers">
        <img src="../images/offer 9.jpg" alt="">
        <h2>Our Offers</h2>

        <div class="offer-container">
            <div class="offer-box">
                <img src="../images/offer 1.jpg" alt="">
            </div>
            <div class="offer-box">
                <img src="../images/offer 2.jpg" alt="offer">
            </div>
            <div class="offer-box">
                <img src="../images/offer 3.jpg" alt="offer">
            </div>
            <div class="offer-box">
                <img src="../images/offer 4.jpg" alt="offer">
            </div>
            <div class="offer-box">
                <img src="../images/offer 5.jpg" alt="offer">
            </div>
            <div class="offer-box">
                <img src="../images/offer 6.jpg" alt="offer">
            </div>
            <div class="offer-box">
                <img src="../images/offer 7.jpg" alt="offer">
            </div>
            <div class="offer-box">
                <img src="../images/offer 8.jpg" alt="offer">
            </div>
        </div>
    </div>


    <!-- start scrool -->
    <button id="scroll"><i class="fa-solid fa-angles-up"></i></button>
    <script>

        //scrool 
        let scr= document.getElementById('scroll');

        window.onscroll = function(){
            if(scrollY >= 300)
            {
                scr.style.display = 'block'
            }
            else{
                scr.style.display ='none'
            }
        }
        scr.onclick = function(){
            // scroll(0,0)
            scroll({
                left:0,
                top:0,
                behavior:"smooth"
            })
        }
    </script>
</body>
</html>
