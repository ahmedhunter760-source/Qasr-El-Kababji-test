* {

    margin: 0;
    padding: 0;
}

body {

/* START navigation */
header {
    background-color: black;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    /* position: fixed; */
    align-items: center;
    width: 100%;
    height: 100px;
}
header img {
    width: 60px;
    height: 70px;
}

header h1 {
    font-size: 28px;
    color: var(--darck-gold);
    text-align: center;
    align-items: center;
    margin-left: -250px;
}

header ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: row;
    gap: 40px;
    text-align: center;
    align-items: center;
    position: relative;
}

header ul li {
    margin-right: 20px;
    text-align: center;
}

header ul li a {
    text-decoration: none;
    color: var(--darck-gold);
    font-size: 18px;
}

header ul li a:hover {
    color: var(--red-color);
} 

/* /* end navigation * */

    /* start story  */
    .family {
        background-color: var(--darck-gold);
        padding-top: var(--padding);
        padding-bottom:var(--padding) ;
    }
    .family h2 {
        padding: 10px 0 10px 25px;
        font-size: 32px;
        margin-bottom: 40px;
        color: var(--black-color);
    }
    .family-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 30px;
    }
    .family-box {
        background-color: var(--black-color);
        border-radius: 15px;
        padding: 15px;
        width: 280px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        transition: box-shadow 0.3s ease 0.1s;
        transition: flex-grow .3s linear 0.1s;
        text-align: center;
    }
    .family-box:hover {
        transform:scale(1.1);
    }
    .family-box img {
        width: 100%;
        height: 300px;
        border-radius: 10px;
        margin-bottom: 15px;
    }
    /* start section footer  */
    footer {
        padding: 30px;
        background-color:black;
        color: white;
        text-align: center;
        position: relative;
    }
    .footer-links {
        margin-bottom: 20px;
    }
    .footer-links a {
        color: var(--darck-gold);
        text-decoration: none;
        margin: 15px;
        font-weight: bold;
    }
    .footer-links a:hover {
        color: var(--red-color);
    }
    .social-media {
        margin-bottom: 20px;
    }
    .social-media a {
        margin: 15px;
    }
    footer .foot-img {
        width: 150px;
        height:calc(100% - 20px);
        position: absolute;
        left: 10px;
        top: 10px;
        margin:0 0 0 10px ;
        padding: 0;
    }
    .social-media img {
        width:40px;
        height:40px;
        border-radius: 50%;
        transition: all .3s ease ;
    }
    .social-media img:hover {
        transform: scale(1.1);
    }
    .newsletter h3 {
        color: var(--darck-gold);
        font-size: 24px;
        margin-bottom: 10px;
    }
    .newsletter form {
        display: flex;
        justify-content: center;
        gap: 10px;
    }
    .newsletter input {
        padding: 10px;
        width: 250px;
        border-radius: 5px;
        border: none;
        outline: none;
    }
    .newsletter button {
        padding: 10px 20px;
        background-color: var(--darck-gold);
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }
    .newsletter button:hover {
        background-color: var(--bottom-color);
    }
    /* end section footer  */

    /* start scroll  */
    #scroll {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        padding: 5px;
        border: 2px dotted #777;
        color: var(--bottom-color);
        position: fixed;
        bottom: 10px;
        right: 10px;
        cursor: pointer;
        display: none;
        justify-content: center;
        align-items: center;
    }

    <script>

        //scrool 
        let scr= document.getElementById('scroll');

        window.onscroll = function(){
            if(scrollY >= 300)
            {
                scr.style.display = 'block'
            }
            else{
                scr.style.display ='none'
            }
        }
        scr.onclick = function(){
            // scroll(0,0)
            scroll({
                left:0,
                top:0,
                behavior:"smooth"
            })
        }
