<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Qasr El Kababji</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {

            --red-color:#FF0000;
            --other-red:#E62117;
            --gold-color:#FEE135;
            --darck-gold:#E0B75C;
            --black-color:#0A0A0A;
            --gray-color:#555;
            --margin-spice:40px;
            --padding:30px;
            --bottom-color:#ff9900;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial,sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--darck-gold);
        }

        
        header {
            background-color:black;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            /* position: fixed; */
            align-items: center;
            width: 100%;
            height: 100px;
            margin: 0;
        }

        header .logo {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        header .logo img {
            width: 80px;
            height: 80px;
        }

        header .logo h1 {
            font-size: 28px;
            color: var(--darck-gold);
        }

        header ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: row;
            gap: 40px;
            text-align: center;
            align-items: center;
            position: relative;
        }

        header ul li {
            margin-right: 20px;
            text-align: center;
        }

        header ul li a {
            text-decoration: none;
            color: var(--darck-gold);
            font-size: 20px;
        }

        header ul li a:hover {
            color: var(--red-color);
        } 

        /* /* end navigation * */


        /* start menu  */
        .menu {
            background-color: var(--darck-gold);
            padding-bottom:var(--padding) ;
        }
        .menu img {
            padding: 0;
            margin:0;
            width: 100%;
        }
        .menu-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 30px;
        }
        .menu-box {
            background-color: var(--black-color);
            border-radius: 15px;
            padding: 15px;
            width: 280px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease 0.1s;
            transition: flex-grow .3s linear 0.1s;
            text-align: center;
        }
        .menu-box:hover {
            transform:scale(1.1);
        }
        .menu-box img {
            width: 100%;
            height: 300px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        /* section calculator */
        .calculator {
            margin: 30px 0 20px 0;
            padding: 20px;
            background: var(--black-color);
            border-radius: 10px;
            max-width: 400px;
            text-align: center;
            position: relative;
            left: 480px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .calculator h2 {
            color: var(--darck-gold);
        }

        .calculator input {
            padding: 10px;
            font-size: 16px;
            width: 80%;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .calculator button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: var(--darck-gold);
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .calculator button:hover {
            background-color: var(--bottom-color);
        }

        .result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: var(--darck-gold);
        }

        /* start scroll  */
        #scroll {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            padding: 5px;
            border: 2px dotted #777;
            color: var(--other-red);
            position: fixed;
            bottom: 10px;
            right: 10px;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../images/logo 001.jpg" alt="logo">
            <h1>Qasr El-Kababji</h1>
        </div>
        
        <ul>
            <li><a href="/index.html">Home</a></li>
            <li><a href="Barbecue.html">Dishes</a></li>
            <li><a href="drink.html">Drink</a></li>
            <li><a href="story.html">story</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </header>
    
    <!-- start menu section  -->

    <div class="menu">
        <img src="../images/menu 01.jpg" alt="">

        <div class="menu-container">
            <div class="menu-box">
                <img src="../images/menu 12.jpg" alt="menu">
            </div>
            <div class="menu-box">
                <img src="../images/menu 02.jpg" alt="menu">

            <div class="menu-box">
                <img src="../images/menu 03.jpg" alt="menu">
            </div>
            <div class="menu-box">
                <img src="../images/menu 04.jpg" alt="menu">
            </div>
            <div class="menu-box">
                <img src="../images/menu 05.jpg" alt="menu">
            </div>
            <div class="menu-box">

            <div class="menu-box">

            <div class="menu-box">

            <div class="menu-box">

            <div class="menu-box">

            <div class="menu-box">

            </div>
            <div class="menu-box">

            </div>
        </div>
    </div>

    <!-- TEXT calculator -->
    <div class="calculator">
        <h2>Price Calculator (with 15% tax)</h2>
        <input type="number" id="price" placeholder="enter item price">
        <br>
        <button onclick="calculateTax()">Calculate</button>
        <div class="result" id="result"></div>
    </div>

    <!-- start scrool -->
    <button id="scroll"><i class="fa-solid fa-angles-up"></i></button>


    <script>
        function calculateTax() {
            let price = document.getElementById("price").value;
            let total = price * 1.15;
            document.getElementById("result").innerText = "Total with tax " + total + "EGP"
        }

        //scrool 
        let scr= document.getElementById('scroll');

        window.onscroll = function(){
            if(scrollY >= 300)
            {
                scr.style.display = 'block'
            }
            else{
                scr.style.display ='none'
            }
        }
        scr.onclick = function(){
            // scroll(0,0)
            scroll({
                left:0,
                top:0,
                behavior:"smooth"
            })
        }
    </script>
</body>
